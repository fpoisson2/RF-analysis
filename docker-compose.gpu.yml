# GPU overlay — applied on top of docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Requires nvidia-container-toolkit on the host (and an NVIDIA GPU).

services:
  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
